apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-translator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nechami649Finkel/app-translator.git
    targetRevision: HEAD
    path: helm/app-translator
  destination:
    server: https://kubernetes.default.svc
    namespace: app-translator
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
