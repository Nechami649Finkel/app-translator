apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        monitoring: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
        imagePullPolicy: {{ .Values.backend.image.PullPolicy }}
        ports:
        - containerPort: {{ .Values.backend.port }}   
        livenessProbe:
          httpGet: 
            path: /health
            port: {{ .Values.backend.port }}   
          initialDelaySeconds: 10
          periodSeconds : 3
        readinessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.backend.port }}   
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
        env:
          - name: DATABASE_URL
            value: "postgres://postgres:postgres@postgres-service:5432/translations"
          - name: TRANSLATOR_HOST
            value: "translator-service"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
    monitoring: "true"
spec:
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.port }}   
      targetPort: {{ .Values.backend.port }}   
  type: ClusterIP
