name: ci-frontend
on:
  push:
    branches: [main, ci/cd]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/ci-frontend.yaml'  
  pull_request:
    branches: [main, ci/cd]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/ci-frontend.yaml'
permissions: 
  id-token: write
  contents: write 

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify files
        run: |
          ls -la app/frontend/
          echo "Frontend files verified"
  deploy-to-s3:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/cd')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN}}
          aws-region: us-east-1
      - name: Sync to S3
        run: |
          aws s3 sync app/frontend/ s3://${{ secrets.S3_BUCKET_NAME}}/ \
            --delete \
            --exclude "*.test.js" \
            --exclude "Dockerfile" \
            --exclude ".dockerignore" \
            --exclude "nginx*.conf"
          echo "✅ Deployed to S3!"
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Apply
        run: |
          cd app/terraform
          terraform init
          terraform apply -auto-approve

      - name: Deploy to S3
        run: |
          aws s3 sync app/frontend/ s3://nechami-project-frontend-2026 --delete
      - name: Cleanup Lock on Failure
        if: failure()
        run: |
          echo "Terraform failed, cleaning up lock..."
          # פקודה שמוחקת את השורה בטבלת ה-DynamoDB
          aws dynamodb delete-item \
            --table-name terraform-lock-table \
            --key '{"LockID": {"S": "nechami-s3-bucket/terraform.tfstate-md5"}}'
